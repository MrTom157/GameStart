<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="index.html">GameStart</a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="login.html">Iniciar Sesion</a></li>
                <li><a href="admin/index.html">Admin</a></li>
            </ul>
            <a href="carrito.html" class="carrito-icono">
                Carrito <span class="contador" id="carrito-contador"></span>
            </a>
        </nav>
    </header>
    <main>
        <form class="formulario" id="form-contacto">
            <h1>Contáctanos</h1>
            <p>Tienes dudas o sugerencias? Escribenos.</p>
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" maxlength="100">
                <div class="mensaje-error" id="error-ctc-nombre"></div>
            </div>
            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" name="correo" id="correo" maxlength="100">
                <div class="mensaje-error" id="error-ctc-correo"></div>
            </div>
            <div class="campo">
                <label for="comentario">Comentario</label>
                <textarea name="comentario" id="comentario" rows="5" maxlength="500"></textarea>
                <div class="mensaje-error" id="error-ctc-comentario"></div>
            </div>
            <button type="submit" class="btn-form">Enviar Mensaje</button>
        </form>
    </main>
    <footer class="footer">
        <p>© 2026 GameStart - Todos los derechos reservados</p>
        <p><a href="contacto.html">Contacto</a> | <a href="nosotros.html">Nosotros</a></p>
    </footer>
