        </nav>
    </header>
    <main>
    <form class="formulario" id="form-login" onsubmit="return validarLogin(this)">
      <h1>GameStart</h1>
      <p>Inicia sesión en tu cuenta</p>

      <div class="campo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" placeholder="ejemplo@duoc.cl" >
        <div class="mensaje-error" id="error-login-correo"></div>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="text" id="password" name="password" placeholder="••••••••" >
        <div class="mensaje-error" id="error-login-password"></div>
      </div>

      <button type="submit" class="btn-form">Ingresar</button>
      <p>¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </form>
  </main>
