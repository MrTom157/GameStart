<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - GameStart</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="header">
        <nav class="nav-container">
            <a href="index.html">GameStart</a>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="blogs.html">Blogs</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="login.html">Iniciar Sesion</a></li>
                <li><a href="admin/index.html">Admin</a></li>
            </ul>
            <a href="carrito.html" class="carrito-icono">
                Carrito <span class="contador" id="carrito-contador"></span>
            </a>
        </nav>
    </header>
    <main>
    <form class="formulario" id="form-registro" onsubmit="return validarRegistro(this)">
      <h1>Crear cuenta</h1>

      <div class="campo">
        <label for="run">RUN (sin puntos ni guion)</label>
        <input type="text" id="run" name="run" placeholder="19011022K" >
        <div class="mensaje-error" id="error-reg-run"></div>
      </div>

      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="50" >
        <div class="mensaje-error" id="error-reg-nombre"></div>
      </div>

      <div class="campo">
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos" maxlength="100" >
        <div class="mensaje-error" id="error-reg-apellidos"></div>
      </div>

      <div class="campo">
        <label for="correo">Correo</label>
        <input type="email" id="correo" name="correo" placeholder="usuario@duoc.cl" >
        <div class="mensaje-error" id="error-reg-correo"></div>
      </div>

      <div class="campo">
        <label for="password">Contraseña (4 a 10 caracteres)</label>
        <input type="text" id="password" name="password">
        <div class="mensaje-error" id="error-reg-password"></div>
      </div>

      <div class="campo">
        <label for="direccion">Dirección</label>
        <input type="text" id="direccion" name="direccion" maxlength="300" >
        <div class="mensaje-error" id="error-reg-direccion"></div>
      </div>

      <div class="campo">
        <label for="region">Región</label>
        <select id="region" name="region" onchange="cargarComunas()">
          <option value="">Selecciona región</option>
        </select>
        <div class="mensaje-error" id="error-reg-region"></div>
      </div>

      <div class="campo">
        <label for="comuna">Comuna</label>
        <select id="comuna" name="comuna">
          <option value="">Selecciona comuna</option>
        </select>
        <div class="mensaje-error" id="error-reg-comuna"></div>
      </div>

      <button type="submit" class="btn-form">Registrarme</button>
    </form>
  </main>

        <p>© 2026 GameStart - Todos los derechos reservados</p>

    <script src="js/regiones.js"></script>
    <script src="js/carrito.js"></script>

    <script src="js/main.js"></script>
</body>
</html>
